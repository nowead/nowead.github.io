<header class="site-header wrap">
  <a class="brand" href="{{ "/" | relURL }}" aria-label="민대원 홈">민대원</a>
  <nav class="site-nav" aria-label="주 메뉴">
    <a href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ else if and (ne .Section "portfolio") (ne .Section "vulkan-study-log") }} aria-current="true"{{ end }}>블로그</a>
    <a href="{{ "/vulkan-study-log/" | relURL }}"{{ if eq .Section "vulkan-study-log" }} aria-current="{{ if .IsSection }}page{{ else }}true{{ end }}"{{ end }}>Study Log</a>
    <a href="{{ "/portfolio/" | relURL }}"{{ if eq .Section "portfolio" }} aria-current="{{ if .IsSection }}page{{ else }}true{{ end }}"{{ end }}>Portfolio</a>
  </nav>
  <button class="theme-control" type="button" aria-label="어두운 테마로 전환" title="테마 전환" hidden>
    <svg class="sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
    <svg class="moon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg>
  </button>
</header>
