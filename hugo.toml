baseURL = "https://nowead.github.io/"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
title = "민대원 | Graphics & Game Engine Developer"
theme = "terminal"

# 포트폴리오 전용 사이트: 태그·카테고리·RSS 페이지는 만들지 않습니다.
disableKinds = ["taxonomy", "term", "rss"]

[taxonomies]

# 마크다운 설정
[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = false
    noClasses = false
    style = "github"
  [markup.goldmark.renderer]
    unsafe = true
